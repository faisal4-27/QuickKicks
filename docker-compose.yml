services:
  postgres:
    image: postgres:16-alpine
    container_name: quickkicks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickkicks
      POSTGRES_PASSWORD: quickkicks
      POSTGRES_DB: quickkicks
    ports:
      - "5433:5432"
    volumes:
      - quickkicks-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickkicks -d quickkicks"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quickkicks-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quickkicks-pgdata:
